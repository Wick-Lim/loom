[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Wick-Lim <wicklim90@gmail.com>"]
repository = "https://github.com/Wick-Lim/loom"
homepage = "https://github.com/Wick-Lim/loom"
documentation = "https://github.com/Wick-Lim/loom"
readme = "README.md"
keywords = ["vcs", "git", "multi-agent", "tree-sitter", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
loom-core = { package = "loom-vcs-core", path = "crates/loom-core", version = "0.1.0" }
loom-vfs = { package = "loom-vcs-vfs", path = "crates/loom-vfs", version = "0.1.0" }
loom-daemon = { package = "loom-vcs-daemon", path = "crates/loom-daemon", version = "0.1.0" }

# Async & IPC
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7"
interprocess = { version = "2.4.9", features = ["tokio"] }

# Storage & Serialization
redb = "5.0.0"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
zstd = "0.14.4" # Default features only — NEVER enable "cmake"
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
rmp-serde = "1.3.1"
toml = "1.2.2"
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"

# CLI & TUI
clap = { version = "4.6.9", features = ["derive", "env"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

# OS CoW Drivers
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_Storage_ProjectedFileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
rustix = { version = "1.1.6", features = ["fs"] }
libc = "0.2.191"

# CST, CRDT, Radar, MCP, Git (pinned for M3-M5)
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
streaming-iterator = "0.1.9"
automerge = "0.12.0"
notify = "9.0.0"
notify-debouncer-full = { version = "0.8.0", features = ["tokio"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
gix = { version = "0.90.0", features = ["blocking-network-client"] }

# Supporting
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.3", features = ["v4", "v7", "serde"] }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
