name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace Tests
        run: cargo test --workspace -- --skip live_agy_cli_spawn_and_mcp_serve_integration
      - name: Bench Harness Tests
        run: cargo test --manifest-path benches/Cargo.toml
      - name: Verify Crate Packaging
        if: matrix.os != 'macos-latest'
        run: cargo package --workspace --no-verify --allow-dirty

  packaging:
    name: Packaging & Installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Manifest Generator
        run: node --test scripts/test-manifests.mjs
      - name: Syntax-Check Shell Installer
        run: sh -n scripts/install.sh
      - name: Syntax-Check PowerShell Installer
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build loom Binary & Test npm Launcher
        run: |
          cargo build --locked --package loom-vcs --bin loom
          LOOM_BINARY_PATH="$PWD/target/debug/loom" node --test npm/loom-vcs/test/launcher.test.mjs
